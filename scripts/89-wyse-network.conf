server.modules += ( "mod_openssl", "mod_auth", "mod_authn_file" )
static-file.exclude-extensions += ( ".py" )

$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/wyse.crt"
    ssl.privkey = "/etc/lighttpd/wyse.key"
    auth.backend = "htpasswd"
    auth.backend.htpasswd.userfile = "/etc/lighttpd/wyse-auth/htpasswd"
    auth.require = ( "/network.py" => ( "method" => "basic", "realm" => "Wyse administration",
                              "require" => "valid-user" ) )
    $HTTP["url"] == "/network.py" {
        cgi.assign = ( ".py" => "/usr/bin/python3" )
    }
} else {
    $HTTP["url"] =~ "^/network[.]py(?:/|$)" {
        url.access-deny = ( "" )
    }
}
